<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>Settings</h1>
        <form>

            <div class="group">
                <h2>Account</h2>
                <div class="group-body">
                    <div class="field">
                        <label for="r-fullname">Full Name</label>
                        <input type="text" id="r-fullname" name="r-fullname">
                    </div>
                    <div class="field">
                        <label for="r-email">Email Address</label>
                        <input type="email" id="r-email" name="r-email">
                    </div>
                    <div class="field half">
                        <label for="r-phone">Phone Number</label>
                        <input type="tel" id="r-phone" name="r-phone">
                    </div>
                </div>
            </div>

            <div class="group">
                <h2>Billing</h2>
                <div class="group-body">
                    <div class="row">
                        <div class="field">
                            <label for="r-plan">Plan</label>
                            <input type="text" id="r-plan" name="r-plan">
                        </div>
                        <div class="field">
                            <label for="r-billing">Billing Interval</label>
                            <select id="r-billing" name="r-billing"></select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="group">
                <h2>Business Address</h2>
                <div class="group-body">
                    <div class="field">
                        <label for="r-street">Street Address</label>
                        <input type="text" id="r-street" name="r-street">
                    </div>
                    <div class="row">
                        <div class="field">
                            <label for="r-city">City</label>
                            <input type="text" id="r-city" name="r-city">
                        </div>
                        <div class="field">
                            <label for="r-province">Province</label>
                            <select id="r-province" name="r-province"></select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="field">
                            <label for="r-zip">ZIP/Postal Code</label>
                            <input type="text" id="r-zip" name="r-zip">
                        </div>
                        <div class="field">
                            <label for="r-country">Country</label>
                            <select id="r-country" name="r-country"></select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="group">
                <h2>Change Password <small>Password must be at least 6 characters.</small></h2>
                <div class="group-body">
                    <div class="row">
                        <div class="field">
                            <label for="r-password">Password</label>
                            <input type="password" id="r-password" name="r-password">
                        </div>
                        <div class="field">
                            <label for="r-confirm-password">Confirm Password</label>
                            <input type="password" id="r-confirm-password" name="r-confirm-password">
                        </div>
                    </div>
                </div>
            </div>

            <div class="buttons">
                <button type="reset" class="cancel">Cancel</button>
                <button type="submit" class="update">Update</button>
            </div>

        </form>
    </section>
</body>
</html>
