<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="left-section">
        <h1 id="header">Settings</h1>
        <form>
            <div class="field">
                <label for="l-fullname">Full Name</label>
                <input type="text" id="l-fullname" name="l-fullname">
            </div>

            <div class="field">
                <label for="l-email">Email Address</label>
                <input type="email" id="l-email" name="l-email">
            </div>

            <div class="field">
                <label for="l-phone">Phone Number</label>
                <input type="tel" id="l-phone" name="l-phone">
            </div>

            <div class="row">
                <div class="field">
                    <label for="l-plan">Plan</label>
                    <input type="text" id="l-plan" name="l-plan">
                </div>
                <div class="field">
                    <label for="l-billing">Billing Interval</label>
                    <select id="l-billing" name="l-billing"></select>
                </div>
            </div>

            <div class="field">
                <label for="l-street">Street Address</label>
                <input type="text" id="l-street" name="l-street">
            </div>

            <div class="row">
                <div class="field">
                    <label for="l-city">City</label>
                    <input type="text" id="l-city" name="l-city">
                </div>
                <div class="field">
                    <label for="l-province">Province</label>
                    <select id="l-province" name="l-province"></select>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label for="l-zip">ZIP/Postal Code</label>
                    <input type="text" id="l-zip" name="l-zip">
                </div>
                <div class="field">
                    <label for="l-country">Country</label>
                    <select id="l-country" name="l-country"></select>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label for="l-password">Password</label>
                    <input type="password" id="l-password" name="l-password">
                </div>
                <div class="field">
                    <label for="l-confirm">Confirm Password</label>
                    <input type="password" id="l-confirm" name="l-confirm">
                </div>
            </div>

            <div class="buttons">
                <button type="reset" id="cancel" class="cancel">Cancel</button>
                <button type="submit" id="submit" class="submit">Submit</button>
            </div>
        </form>
    </section>

    <section id="result-section">
        <h1 id="out-fullname"></h1>
        <h1 id="out-email"></h1>
        <h1 id="out-phone"></h1>
        <h1 id="out-plan"></h1>
        <h1 id="out-billing"></h1>
        <h1 id="out-street"></h1>
        <h1 id="out-city"></h1>
        <h1 id="out-province"></h1>
        <h1 id="out-zip"></h1>
        <h1 id="out-country"></h1>
        <h1 id="out-password"></h1>
    </section>

    <script src="index.js"></script>
</body>
</html>
